<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Snow Plow Empire: 100 Cities</title>
<style>
:root{--navy:#0a1626;--ice:#d6ecff;--or:#ff8a1f;--yl:#ffd23f;--cy:#56d8ff;--glass:rgba(10,22,38,.72)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0a1626;color:var(--ice);font-family:'Trebuchet MS','Segoe UI',Tahoma,Arial,sans-serif;touch-action:none}
canvas#c{position:fixed;inset:0;display:block}
#hud{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#hud *{pointer-events:none}
#hud button,#hud #joyzone{pointer-events:auto}
.chip{background:var(--glass);border:2px solid rgba(214,236,255,.25);border-radius:14px;padding:6px 12px;backdrop-filter:blur(4px)}
#tl{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:5px;width:min(210px,46vw)}
#money{width:fit-content}
#money{font:900 24px Impact,'Arial Black',sans-serif;color:var(--yl);letter-spacing:.5px;display:flex;gap:6px;align-items:center;transition:transform .12s}
#money.pop{transform:scale(1.12)}
#money b{color:var(--or)}
#cityname{font-size:13px;font-weight:700;line-height:1.25}
#cityname small{display:block;opacity:.7;font-weight:400}
.bar{position:relative;height:18px;border-radius:9px;background:rgba(0,0,0,.45);border:2px solid rgba(214,236,255,.3);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:7px;transition:width .15s}
.bar span{position:absolute;inset:0;text-align:center;font-size:11px;font-weight:800;line-height:14px;text-shadow:0 1px 2px #000}
#prog i{background:linear-gradient(90deg,#3fa9ff,#8fe3ff)}
#tr{position:absolute;right:10px;top:10px;display:flex;gap:8px}
#tr button{pointer-events:auto;min-width:46px;height:46px;border-radius:14px;border:2px solid rgba(214,236,255,.3);background:var(--glass);color:var(--ice);font:800 14px inherit;font-family:inherit;padding:0 12px}
#tr button.main{background:linear-gradient(#ffa63f,#ff7a12);color:#2a1300;border-color:#ffd9a8}
#tr button:active{transform:scale(.95)}
#bars{display:flex;flex-direction:column;gap:4px}
#bars .bar{height:16px}
#bars .bar span{line-height:12px;font-size:10px}
.tank i{background:linear-gradient(90deg,#e8f3ff,#9fd0ff)}
.tank.full i{background:linear-gradient(90deg,#ff6a3d,#ffb23f);animation:fl .4s infinite alternate}
.nit i{background:linear-gradient(90deg,#2d7bff,#6ff2ff)}
@keyframes fl{to{filter:brightness(1.5)}}
#chestbox{position:absolute;right:8px;top:54px;font:900 13px Impact,'Arial Black',sans-serif;color:#2a1b00;background:linear-gradient(#ffe27a,#ffb41f);border-radius:12px;padding:6px 14px;display:none;box-shadow:0 0 18px #ffc83a}
#banner{position:absolute;left:50%;top:22%;transform:translate(-50%,0);font:900 clamp(22px,5vw,44px) Impact,'Arial Black',sans-serif;text-align:center;color:#fff;text-shadow:0 3px 0 #0a1626,0 0 22px var(--cy);opacity:0;white-space:nowrap}
#banner.show{animation:bn 2.4s ease-out forwards}
@keyframes bn{0%{opacity:0;transform:translate(-50%,16px) scale(.8)}12%{opacity:1;transform:translate(-50%,0) scale(1.08)}20%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0}}
#combo{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font:900 clamp(26px,7vw,60px) Impact,'Arial Black',sans-serif;color:var(--yl);text-shadow:0 4px 0 #b34a00,0 0 26px #ff8a1f;opacity:0;white-space:nowrap;text-align:center}
#combo.show{animation:cb 1.5s ease-out forwards}
@keyframes cb{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}28%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
#hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-weight:800;font-size:12px;max-width:calc(100vw - 210px);background:var(--glass);border-radius:12px;padding:6px 14px;display:none;text-align:center;max-width:80vw}
#joyzone{position:absolute;left:0;top:14%;width:55%;bottom:0}
#jbase{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid rgba(214,236,255,.45);background:rgba(214,236,255,.1);display:none}
#jknob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:radial-gradient(#fff,#9ccfff);box-shadow:0 0 14px #56d8ff}
#bNitro{position:absolute;right:16px;bottom:16px;width:96px;height:96px;border-radius:50%;border:4px solid #bfe9ff;background:radial-gradient(circle at 35% 30%,#7fe8ff,#1c6bff 70%);color:#fff;font:900 17px Impact,'Arial Black',sans-serif;box-shadow:0 0 22px #3aa9ff;touch-action:none}
#bNitro.on{filter:brightness(1.5);transform:scale(.94)}
#bFreeze{position:absolute;right:26px;bottom:128px;width:66px;height:66px;border-radius:50%;border:3px solid #e6f7ff;background:radial-gradient(circle at 35% 30%,#fff,#7fc8ff 75%);color:#073a66;font:900 24px inherit;display:none;touch-action:none}
#bFreeze:disabled{filter:grayscale(.8) brightness(.6)}
#bFreeze small{display:block;font-size:10px;line-height:10px}
.modal{position:fixed;inset:0;background:rgba(4,10,20,.78);display:none;align-items:center;justify-content:center;z-index:5;padding:10px;touch-action:pan-y}
.modal.open{display:flex}
.panel{background:linear-gradient(#13263d,#0b1828);border:3px solid #3d6a94;border-radius:20px;max-width:760px;width:100%;max-height:94vh;overflow:auto;padding:16px 18px;position:relative;box-shadow:0 0 0 4px #091321,0 20px 60px #000}
.panel h2{margin:0 0 6px;font:900 28px Impact,'Arial Black',sans-serif;color:var(--yl);letter-spacing:.5px}
.panel .x{position:absolute;top:10px;right:12px;width:40px;height:40px;border-radius:12px;border:2px solid #3d6a94;background:#0b1828;color:var(--ice);font-size:20px;font-weight:900}
.panel[dir=rtl] .x{right:auto;left:12px}
.m2{font:900 22px Impact,'Arial Black',sans-serif;color:var(--or);margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.card{display:flex;gap:10px;align-items:center;background:rgba(214,236,255,.07);border:2px solid rgba(214,236,255,.14);border-radius:14px;padding:8px 10px}
.card .ic{font-size:28px;width:42px;text-align:center}
.card .tx{flex:1;min-width:0}
.card b{display:block;font-size:14px}
.card small{display:block;font-size:11px;opacity:.75;line-height:1.25;margin:1px 0 4px}
.pips{display:flex;gap:3px}
.pips u{width:100%;max-width:14px;height:6px;border-radius:3px;background:#2c4560}
.pips u.on{background:var(--cy)}
.card button,.mis button,.btn{border:0;border-radius:12px;background:linear-gradient(#ffa63f,#ff7a12);color:#2a1300;font:900 14px inherit;font-family:inherit;padding:10px 14px;min-width:84px;box-shadow:0 3px 0 #a14a00}
.card button:disabled,.mis button:disabled,.btn:disabled{background:#33465c;color:#8fa6bd;box-shadow:none}
.btn:active,.card button:active,.mis button:active{transform:translateY(2px)}
.btn.alt{background:linear-gradient(#5aa9e6,#2f78b8);color:#fff;box-shadow:0 3px 0 #1b4a75}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.cb{border:2px solid rgba(214,236,255,.2);background:rgba(214,236,255,.08);color:var(--ice);border-radius:12px;padding:8px 6px;text-align:center;font-family:inherit;font-size:12px;font-weight:700}
.cb b{display:block;font:900 18px Impact,sans-serif;color:var(--cy)}
.cb small{display:block;opacity:.7;font-size:10px}
.cb.cur{border-color:var(--yl);background:rgba(255,210,63,.15)}
.cb.lock{opacity:.4}
.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(214,236,255,.12);font-weight:700}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

@media (max-height:520px){#bNitro{width:80px;height:80px;bottom:10px}#bFreeze{bottom:100px;width:56px;height:56px}#bars{bottom:6px}.panel{padding:10px 14px}}
#tr button{position:relative}
#bossbox{display:none;width:fit-content;font:900 14px Impact,'Arial Black',sans-serif;color:#ffd6d6;border-color:rgba(255,90,90,.65);background:rgba(70,8,18,.82)}
#bossbox.warn{animation:fl .4s infinite alternate;color:#fff}
#buffbox{position:absolute;right:8px;top:92px;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
#buffbox div{font:900 12px Impact,'Arial Black',sans-serif;border-radius:10px;padding:4px 10px;color:#06223a;background:linear-gradient(#9ff0ff,#4cc3ff);box-shadow:0 0 14px #56d8ff}
#buffbox div.sp{color:#2a1b00;background:linear-gradient(#ffe27a,#ffb41f);box-shadow:0 0 14px #ffc83a}
#bDaily.dot::after{content:'';position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:#ff3b3b;border:2px solid #fff;animation:fl .5s infinite alternate}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:8px 0 10px}
.day{text-align:center;border:2px solid rgba(214,236,255,.2);background:rgba(214,236,255,.07);border-radius:12px;padding:6px 2px;font-size:11px;font-weight:700}
.day b{display:block;font:900 18px Impact,sans-serif;color:var(--cy)}
.day .ic2{font-size:20px;display:block;margin:2px 0}
.day.cur{border-color:var(--yl);background:rgba(255,210,63,.18)}
.day.past{opacity:.5}
.mis{display:flex;gap:10px;align-items:center;background:rgba(214,236,255,.07);border:2px solid rgba(214,236,255,.14);border-radius:14px;padding:8px 10px;margin-top:8px}
.mis .tx{flex:1;min-width:0}
.mis b{display:block;font-size:14px;margin-bottom:4px}
.mis .bar{height:14px}
.mis .bar i{background:linear-gradient(90deg,#ffb41f,#ffe27a)}
.mis .bar span{line-height:10px;font-size:10px}
.dmsg{background:rgba(255,210,63,.15);border:2px solid var(--yl);border-radius:12px;padding:8px 12px;font-weight:800;color:var(--yl);margin:6px 0}

#tr #bTrophy{font-size:22px;background:linear-gradient(#ffe27a,#ffb41f);color:#3a2500;border-color:#fff2b8;box-shadow:0 0 14px #ffc83a,0 0 28px rgba(255,200,58,.55);animation:tg 1.8s ease-in-out infinite}
@keyframes tg{50%{box-shadow:0 0 22px #ffd95a,0 0 44px rgba(255,200,58,.9);transform:scale(1.07)}}
#tr #bTrophy.alert{animation:tg .6s ease-in-out infinite}
#tr #bTrophy.alert::after{content:'!';position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#ff3b3b;color:#fff;border:2px solid #fff;font:900 12px/14px Arial,sans-serif;text-align:center}
#pTour{border-color:#d4a62a;background:linear-gradient(#2a2108,#120d03 75%);box-shadow:0 0 0 4px #1a1304,0 0 40px rgba(255,190,40,.35),0 20px 60px #000;max-width:560px}
#pTour .tH{color:#ffd23f;text-shadow:0 0 18px rgba(255,200,58,.6);font-size:24px;padding-right:44px}
.tsub{font-size:14px;opacity:.85;color:#ffe9a8;margin-bottom:6px}
.tme{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:6px 0 4px;font-weight:800;font-size:14px}
.tme b{color:#ffd23f}
.tname{display:flex;gap:8px;margin:8px 0 2px}
.tname input{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:2px solid #d4a62a;background:#0b0b0b;color:#fff;font:700 16px 'Trebuchet MS',Arial,sans-serif;user-select:text;-webkit-user-select:text;touch-action:manipulation}
.terr{color:#ff8a8a;font-weight:800;min-height:18px;font-size:13px;margin-bottom:4px}
.trw{display:grid;grid-template-columns:44px 1fr 46px 66px 36px;gap:6px;align-items:center;padding:7px 10px;margin-top:6px;border-radius:12px;background:rgba(255,220,120,.07);border:2px solid rgba(255,210,100,.16);font-weight:800;font-size:13px}
.trw>span:nth-child(n+3){text-align:center}
.trw.hd{background:none;border:0;opacity:.7;font-size:11px;margin-top:2px;padding-top:0;padding-bottom:0}
.trw.emp{opacity:.4}
.trw .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trw .bc{display:flex;justify-content:center}
.trw .rk{font:900 18px Impact,sans-serif;color:#9fb6cc}
.trw.r1{font-size:15px;background:linear-gradient(90deg,rgba(255,210,63,.38),rgba(255,150,20,.16));border-color:#ffd23f;animation:r1g 1.8s ease-in-out infinite}
@keyframes r1g{50%{box-shadow:0 0 26px rgba(255,210,63,.8),inset 0 0 18px rgba(255,235,150,.35)}}
.trw.r2{border-color:#cfd8e3;background:linear-gradient(90deg,rgba(207,216,227,.2),rgba(207,216,227,.05))}
.trw.r3{border-color:#c8803c;background:linear-gradient(90deg,rgba(200,128,60,.24),rgba(200,128,60,.05))}
.trw.me{outline:2px solid #6ff2ff;outline-offset:1px;animation:meg 1.4s ease-in-out infinite}
@keyframes meg{50%{box-shadow:0 0 22px rgba(111,242,255,.85),inset 0 0 14px rgba(111,242,255,.35)}}
.crown{font-size:28px;line-height:1;display:inline-block;animation:crw 1.4s ease-in-out infinite;filter:drop-shadow(0 0 8px #ffd23f)}
@keyframes crw{50%{transform:translateY(-3px) rotate(-7deg) scale(1.12)}}
.bdg{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:18px}
.bdg.sv{background:radial-gradient(#fff,#b9c4d0);box-shadow:0 0 10px #cfd8e3}
.bdg.bz{background:radial-gradient(#ffd0a0,#b86a2d);box-shadow:0 0 10px #c8803c}
.tfoot{margin-top:10px;font-weight:800;color:#ffe9a8;text-align:center}
.tfoot.sm{font-size:11px;opacity:.7;font-weight:700;margin-top:6px}
@media (max-width:640px){.trw{grid-template-columns:38px 1fr 38px 56px 30px;padding:6px 7px;gap:4px;font-size:12px}}
.pinl{font-weight:800;font-size:12px;opacity:.75;margin:10px 0 4px}
.cgrid.pin{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.pinb{border-color:var(--yl);box-shadow:0 0 14px rgba(255,210,63,.45)}
</style>
</head>

function auInit(){
 if(AU.c){if(AU.c.state==='suspended')AU.c.resume();return}

  AU.m=c.createGain();AU.m.gain.value=S.sound?.55:0;AU.m.connect(c.destination);
  const len=c.sampleRate*2,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.nb=buf;
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=330;AU.eg=c.createGain();AU.eg.gain.value=0;
  AU.o1=c.createOscillator();AU.o1.type='sawtooth';AU.o2=c.createOscillator();AU.o2.type='square';
  AU.o1.connect(lp);AU.o2.connect(lp);lp.connect(AU.eg);AU.eg.connect(AU.m);AU.o1.start();AU.o2.start();
  const ns=c.createBufferSource();ns.buffer=buf;ns.loop=true;const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2300;bp.Q.value=.8;
  AU.sg=c.createGain();AU.sg.gain.value=0;ns.connect(bp);bp.connect(AU.sg);AU.sg.connect(AU.m);ns.start();
 }catch(e){AU.c=null}

function tone(f,d,type,v,slide){if(!AU.c)return;const c=AU.c,t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+d);g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AU.m);o.start(t);o.stop(t+d+.02)}
function burst(d,f,v,q){if(!AU.c)return;const c=AU.c,t=c.currentTime,s=c.createBufferSource();s.buffer=AU.nb;const fl=c.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f;fl.Q.value=q||.7;const g=c.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl);fl.connect(g);g.connect(AU.m);s.start(t,rnd());s.stop(t+d)}

function auUpdate(sp,vmax,nit,clearRate){
 if(!AU.c)return;const t=AU.c.currentTime,r=clamp(Math.abs(sp)/vmax,0,1.6);
 AU.o1.frequency.setTargetAtTime(36+r*62+(nit?26:0),t,.08);AU.o2.frequency.setTargetAtTime(18+r*31+(nit?13:0),t,.08);

function grade(hex,mode){
 let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
 if(mode===1){r+=(255-r)*.22;g+=(150-g)*.22;b+=(80-b)*.22}
 r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0,sa=0,l=(mx+mn)/2;
 if(d){sa=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}
 if(mode===0){sa=Math.min(1,sa*1.5+.1);l=Math.min(.78,l+.07)}
 else if(mode===1){sa=Math.min(1,sa*1.3+.05);l=Math.min(.75,l+.02)}
 else{sa=Math.min(1,sa*1.4+.15);l=l*.72}
 return `hsl(${h|0},${(sa*100)|0}%,${(l*100)|0}%)`;
}

function roadSpot(minD,list){
 for(let n=0;n<80;n++){
  let x,y,a;
  if(rnd()<.5){x=Math.floor(rnd()*3)*600+95+(rnd()-.5)*90;y=70+rnd()*(WH-140);a=rnd()<.5?PI/2:-PI/2}
  else{y=Math.floor(rnd()*3)*400+95+(rnd()-.5)*90;x=70+rnd()*(WW-140);a=rnd()<.5?0:PI}
  if(Math.hypot(x-MEL.x,y-MEL.y)<190||Math.hypot(x-T.x,y-T.y)<minD+60)continue;
  let ok=true;for(const e of list){if(Math.hypot(x-e.x,y-e.y)<minD){ok=false;break}}

$('pShop').addEventListener('click',e=>{
 if(e.target.id==='shX'){closeModals();return}
 const b=e.target.closest('button[data-u]');if(!b)return;const u=UP.find(x=>x.id===b.dataset.u);if(!u)return;const c=upCost(u);
 if(L(u.id)>=MAXL||S.money<c)return;S.money-=c;S.up[u.id]++;sBuy();save();
 if(u.id==='helper'&&!HELP)spawnHelper();
 if(u.id==='tank')R.tank=Math.min(R.tank,tankCap());
 const sc=$('pShop').scrollTop;openShopKeep(sc);
});
function openShopKeep(sc){openShop();$('pShop').scrollTop=sc}
$('pCity').addEventListener('click',e=>{
 if(e.target.id==='ctX'){closeModals();return}
 const b=e.target.closest('button[data-c]');if(!b)return;sClick();closeModals();startCity(+b.dataset.c);
});
$('bShop').onclick=()=>{sClick();openShop()};
$('bCity').onclick=()=>{sClick();openCities()};
$('bDaily').onclick=()=>{sClick();openDaily()};
$('pDaily').addEventListener('click',e=>{
 if(e.target.id==='dyX'){closeModals();return}
 if(e.target.id==='dyClaim'){claimDaily();return}
 const b=e.target.closest('button[data-m]');if(!b||b.disabled)return;const m=S.dm.list[+b.dataset.m];
 if(m&&!m.cl&&m.p>=m.goal){m.cl=true;S.money+=m.rw;sBuy();save();dailyMsg='';const sc=$('pDaily').scrollTop;openDaily();$('pDaily').scrollTop=sc}
});
$('bLang').onclick=()=>{S.lang=S.lang==='ar'?'en':'ar';save();renderStatic();sClick()};
$('bSnd').onclick=()=>{S.sound=!S.sound;if(AU.m)AU.m.gain.value=S.sound?.55:0;renderStatic();save();auInit()};
$('bFreeze').addEventListener('pointerdown',e=>{e.preventDefault();useFreeze()});

/* ================= tournament (TOP 10 SNOW CRUSHERS) - live simulated rivals, no server needed ================= */
const TT={
en:{title:'TOP 10 SNOW CRUSHERS',sub:'Global tournament · only the best stay on top',you:'You',score:'Score',ph:'Enter unique name',save:'Save',player:'Player',cit:'Cities',
 taken:'This name is already taken, choose another name.',bad:'Name: 3–16 letters, numbers, spaces or _',yourRank:'Your rank',need:'You need',pts:'more points to enter the Top 10',
 inTop:'YOU ARE IN THE TOP 10! 🏆',unlockIn:'Next 50 cities in',newCities:n=>`+${n} NEW CITIES UNLOCKED!`,how:'Score = cities×1000 + bosses×2500 + combos×25 + money bonus',nameHint:'Pick a name to claim your spot'},
ar:{title:'أقوى 10 كاسحي ثلج',sub:'بطولة عالمية · الأفضل فقط يبقى في القمة',you:'أنت',score:'النقاط',ph:'اكتب اسمًا فريدًا',save:'حفظ',player:'اللاعب',cit:'المدن',
 taken:'هذا الاسم مأخوذ بالفعل، اختر اسمًا آخر.',bad:'الاسم من 3 إلى 16 حرفًا أو رقمًا أو مسافة أو _',yourRank:'ترتيبك',need:'تحتاج',pts:'نقطة إضافية لدخول أفضل 10',
 inTop:'أنت في قائمة أفضل 10! 🏆',unlockIn:'50 مدينة جديدة بعد',newCities:n=>`تم فتح ${n} مدينة جديدة!`,how:'النقاط = المدن×1000 + الزعماء×2500 + الكومبو×25 + مكافأة الفلوس',nameHint:'اختر اسمًا لتثبيت مكانك'}};
const tt=()=>TT[S.lang]||TT.en;
const hms=ms=>{const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NAME_RE=/^[\p{L}\p{N}_ ]{3,16}$/u;
const nkey=n=>String(n).normalize('NFKC').toLowerCase().replace(/[\s_]+/g,'');
const scoreOf=s=>s.cities*1000+s.bosses*2500+s.combos*25+Math.floor(Math.sqrt(s.money)*5);
const myStats=()=>({cities:S.maxCity|0,money:Math.floor(S.tot||0),bosses:(S.bw||[]).length,combos:S.combos|0});
function ensureId(){if(!S.pn)S.pn='Player_'+(1000+Math.floor(rnd()*9000))}
/* rivals: [name, cities, money, bosses, combos, cities/day, money growth/day, combos/day] measured at launch day, grow every day (and smoothly during the day) */
const RIV=[
 ['FrostKing',84,38e6,8,640,1.6,.035,9],['ArcticWolf',76,24e6,7,540,1.5,.04,8],['SnowMaster99',69,15e6,6,470,1.4,.04,8],
 ['IceBreaker_X',61,9e6,6,400,1.3,.045,7],['PolarPro',53,5.2e6,5,330,1.2,.045,6],['BlizzardAce',45,2.6e6,4,270,1.1,.05,6],
 ['Yuki_JP',38,1.2e6,3,210,1,.05,5],['NordPlow',31,5.5e5,3,160,.9,.055,4],['GlacierHero',25,2.4e5,2,110,.8,.055,3],['WinterVibe',18,9e4,1,60,.7,.06,2]];
const RIVKEYS=new Set(RIV.map(r=>nkey(r[0])));
let TB={top:[],rank:0,cut:0,qual:false},pendingPrompt=false,said=false,tsN=0;
function computeBoard(){
 ensureId();
 const f=Math.max(0,(srvNow()-LAUNCH)/864e5),st=myStats(),sc=scoreOf(st);
 const all=RIV.map(r=>{
  const cities=Math.min(NC,Math.floor(r[1]+r[5]*f)),o={name:r[0],cities,money:Math.floor(r[2]*Math.pow(1+r[6],f)),bosses:Math.min(Math.floor(cities/10),r[3]+Math.floor(f/3)),combos:Math.floor(r[4]+r[7]*f)};
  o.score=scoreOf(o);return o});
 all.push({name:S.pn,cities:st.cities,money:st.money,bosses:st.bosses,combos:st.combos,score:sc,me:true});
 all.sort((a,b)=>b.score-a.score||(a.me?1:b.me?-1:0));
 const idx=all.findIndex(x=>x.me);
 TB.top=all.slice(0,10);TB.rank=idx+1;TB.cut=all[9].score;TB.qual=TB.rank<=10;
}
function tourSubmit(){
 computeBoard();
 const need=TB.qual&&!S.pnSet;
 $('bTrophy').classList.toggle('alert',need);
 if(need&&!S.pAsk){pendingPrompt=true;if(!said){said=true;banner(tt().inTop,3000)}}
}
function renderTour(){
 const t=tt(),sc=scoreOf(myStats());
 let h=`<button class="x" id="tnX">${TX().close}</button><h2 class="tH">🏆 ${t.title}</h2><div class="m2 tsub">${t.sub}</div>`;
 h+=`<div class="tme"><span>${t.you}: <b>${esc(S.pn)}</b></span><span>${t.score}: <b>${fmt(sc)}</b> · #${TB.rank}</span></div>`;
 if(!S.pnSet)h+=`<div class="tname"><input id="tnIn" maxlength="16" placeholder="${t.ph}" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn" id="tnSave">${t.save}</button></div><div class="terr" id="tnErr">${TB.qual?t.nameHint:''}</div>`;
 h+=`<div class="trw hd"><span>#</span><span>${t.player}</span><span>${t.cit}</span><span>$</span><span>👑</span></div>`;
 TB.top.forEach((e,i)=>{
  const bd=i===0?'<span class="crown">👑</span>':i===1?'<span class="bdg sv">🥈</span>':i===2?'<span class="bdg bz">🥉</span>':`<span class="rk">${i+1}</span>`;
  h+=`<div class="trw ${i<3?'r'+(i+1):''} ${e.me?'me':''}"><span class="bc">${bd}</span><span class="nm">${esc(e.name)}</span><span>${e.cities}</span><span>${fmt(e.money)}</span><span>${e.bosses}</span></div>`;
 });
 if(TB.rank>10)h+=`<div class="tfoot">${t.yourRank} #${TB.rank} · ${t.need} ${fmt(Math.max(1,TB.cut-sc+1))} ${t.pts}</div>`;
 h+=`<div class="tfoot sm">${t.how}</div><div class="tfoot sm">⏳ ${t.unlockIn} ${hms(nextUnlockMs())} · 🏙 ${NC}</div>`;
 $('pTour').innerHTML=h;
}
function openTour(){
 $('pTour').setAttribute('dir',S.lang==='ar'?'rtl':'ltr');
 computeBoard();renderTour();openModal('mTour');
}
$('pTour').addEventListener('click',e=>{
 if(e.target.id==='tnX'){closeModals();return}
 if(e.target.id!=='tnSave')return;
 const er=$('tnErr'),v=$('tnIn').value.trim().replace(/\s+/g,' ');er.textContent='';
 if(!NAME_RE.test(v)||/^player_\d+$/i.test(v)){er.textContent=tt().bad;return}
 if(RIVKEYS.has(nkey(v))){er.textContent=tt().taken;return}
 S.pn=v;S.pnSet=true;S.pAsk=true;save();sBuy();$('bTrophy').classList.remove('alert');
 computeBoard();renderTour();
});
$('pTour').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='tnIn'){e.preventDefault();$('tnSave').click()}});
$('bTrophy').onclick=()=>{sClick();openTour()};
function tickTour(){
 const o=NC;refreshUnlock();
 if(NC>o){S.lu=NC;save();banner(tt().newCities(NC-o),3500);renderStatic()}
 tourSubmit();
}
function tourBoot(){
 refreshUnlock();
 if(S.lu&&NC>S.lu)banner(tt().newCities(NC-S.lu),3500);
 S.lu=NC;save();renderStatic();updateHud();tourSubmit();
}

/* ================= input ================= */
const keyMap={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'space'};
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;auInit();const k=keyMap[e.code];if(k){K[k]=1;if(k==='space'||e.code.startsWith('Arrow'))e.preventDefault()}
 if(e.code==='KeyF'||e.code==='KeyE')useFreeze();if(e.code==='KeyU')paused?closeModals():openShop();if(e.code==='Escape')closeModals();if(e.code==='KeyM'){$('bSnd').click()}});
addEventListener('keyup',e=>{const k=keyMap[e.code];if(k)K[k]=0});
addEventListener('blur',()=>{for(const k in K)K[k]=0});
const jz=$('joyzone'),jb=$('jbase'),jk=$('jknob');
jz.addEventListener('pointerdown',e=>{auInit();if(joy.on)return;e.preventDefault();joy.on=true;joy.id=e.pointerId;joy.bx=e.clientX;joy.by=e.clientY;joy.mag=0;jz.setPointerCapture(e.pointerId);
 const r=jz.getBoundingClientRect();jb.style.left=(e.clientX-r.left)+'px';jb.style.top=(e.clientY-r.top)+'px';jb.style.display='block';jk.style.transform='translate(0,0)'});
jz.addEventListener('pointermove',e=>{if(!joy.on||e.pointerId!==joy.id)return;const dx=e.clientX-joy.bx,dy=e.clientY-joy.by,d=Math.hypot(dx,dy),m=60;joy.mag=Math.min(1,d/m);joy.ang=Math.atan2(dy,dx);const k=Math.min(d,m);jk.style.transform=`translate(${Math.cos(joy.ang)*k}px,${Math.sin(joy.ang)*k}px)`});
const joyEnd=e=>{if(e.pointerId!==joy.id)return;joy.on=false;joy.mag=0;jb.style.display='none'};
jz.addEventListener('pointerup',joyEnd);jz.addEventListener('pointercancel',joyEnd);jz.addEventListener('lostpointercapture',joyEnd);
const nb=$('bNitro');
nb.addEventListener('pointerdown',e=>{auInit();e.preventDefault();K.nitB=1;nb.classList.add('on');nb.setPointerCapture(e.pointerId)});
const nEnd=()=>{K.nitB=0;nb.classList.remove('on')};nb.addEventListener('pointerup',nEnd);nb.addEventListener('pointercancel',nEnd);
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(AU.c)AU.c.suspend();save()}else{if(AU.c&&S.sound)AU.c.resume();lastT=performance.now()}});
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('pointerdown',e=>{if(e.target===m&&m.id!=='mDone')closeModals()}));

/* ================= loop ================= */
function resize(){
 W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2)*Q;cv.width=Math.floor(W*dpr);cv.height=Math.floor(H*dpr);cv.style.width=W+'px';cv.style.height=H+'px';
 zoom=H>W?clamp(W/520,.62,1.1):clamp(Math.min(W/900,H/520),.55,1.25);if(city)renderStatic();
}
addEventListener('resize',resize);
let saveT=0,hudAcc=0,doneAcc=0;
function frame(now){
 requestAnimationFrame(frame);
 let dt=(now-lastT)/1000;lastT=now;if(!(dt>0))dt=.016;
 fpsEma+=(dt*1000-fpsEma)*.05;
 if(fpsEma>26&&Q>.6){slowN++;if(slowN>90){Q=Math.max(.6,Q-.15);slowN=0;fpsEma=16;resize()}}else slowN=0;
 dt=Math.min(dt,.05);dtG=dt;
 if(!paused&&!(R.done)){
  R.t+=dt;T.beac+=dt;
  const info=updateTruck(dt);
  updateCars(dt);updatePicks(dt);updateGifts(dt);updateMelter(dt);updateEvents(dt);updateHelper(dt);updateParts(dt);
  auUpdate(T.v,info.vmax,info.nit,R.clrRate);
  hudAcc+=dt;if(hudAcc>.1){hudAcc=0;updateHud()}
  doneAcc+=dt;if(doneAcc>.5){doneAcc=0;checkDone()}
  saveT+=dt;if(saveT>5){saveT=0;save();if(++tsN>=9){tsN=0;tickTour()}}
 }else if(R.done&&!paused){updateParts(dt);updatePicks(dt);updateCars(dt)}
 else if(AU.c)auUpdate(0,300,false,0);
 render(now);
}

/* ================= init ================= */
resize();
initDaily();startCity(clamp(S.city|0,0,Math.min(NC-1,S.maxCity|0)));
renderStatic();updateHud();
lastT=performance.now();requestAnimationFrame(frame);
setTimeout(tourBoot,700); /* instant play: no popups at start, network work runs after the first frames */
})();
</script>
